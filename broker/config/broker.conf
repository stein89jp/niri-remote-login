# Niri-RDP session broker settings.
#
# The broker reads this file once at start. After editing it, restart
# niri-rdp-broker.service; that ends every connected RDP session.
#
# Format: one "key = value" per line; lines starting with "#" are comments.
# The file must be a regular file owned by root and not writable by group or
# others. An unknown key, a repeated key or an invalid value rejects the whole
# file: the broker then logs a warning to the journal and uses the default
# for every setting.

# Seconds a disconnected desktop keeps running for a reconnect, 0-3600.
# 0 logs the session out as soon as the RDP connection ends.
grace_seconds = 45
