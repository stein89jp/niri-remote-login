# Optional NVENC frontend access. Copy this file to
# /etc/systemd/system/niri-rdp-frontend.service.d/nvidia.conf, then reload
# systemd and restart the frontend. Requires a working NVIDIA driver with NVENC.
# The packaged frontend automatically prepares NVIDIA device nodes first.
[Service]
Environment=NIRI_RDP_ENCODER=nvenc
# The standard service hides /dev/dri and /dev/nvidia* in a private /dev.
PrivateDevices=no
SupplementaryGroups=video render
# The base unit keeps DevicePolicy=closed, so allow only the GPU device groups
# from /proc/devices. Paths cannot use globs; device groups cover every GPU
# index. nvidia covers /dev/nvidia[0-9]*, /dev/nvidiactl and
# /dev/nvidia-modeset (one major); nvidia-uvm covers /dev/nvidia-uvm and
# /dev/nvidia-uvm-tools; drm covers /dev/dri/renderD* for GPU capture.
# niri-rdp-nvidia-devices.service loads the modules first, because systemd
# resolves device groups only when the frontend starts.
DeviceAllow=char-nvidia rw
DeviceAllow=char-nvidiactl rw
DeviceAllow=char-nvidia-modeset rw
DeviceAllow=char-nvidia-uvm rw
DeviceAllow=char-drm rw
