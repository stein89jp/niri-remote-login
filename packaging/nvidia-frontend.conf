# Optional NVENC frontend access. Copy this file to
# /etc/systemd/system/niri-rdp-frontend.service.d/nvidia.conf, then reload
# systemd and restart the frontend. Requires a working NVIDIA driver with NVENC.
# The packaged frontend automatically prepares NVIDIA device nodes first.
[Service]
Environment=NIRI_RDP_ENCODER=nvenc
# The standard service hides /dev/dri and /dev/nvidia* in a private /dev.
PrivateDevices=no
SupplementaryGroups=video render
