# fail2ban filter for Niri-RDP login failures. Example only: the package
# installs it as documentation and never enables it.
#
# Copy to /etc/fail2ban/filter.d/niri-rdp.conf and enable the jail from
# niri-rdp.jail.example. The broker logs one journal entry per rejected
# login, for example:
#   auth-fail user=alice rhost=192.0.2.7 result=denied session=-
# result is denied, account-denied or not-authorized. Entries without a
# client address (rhost=-) never match. User names cannot contain spaces,
# so a client cannot forge the rhost field.
#
# Only entries written by root inside niri-rdp-broker.service match, so a
# local user cannot use logger(1) to get other addresses banned.

[INCLUDES]
before = common.conf

[Definition]
_daemon = niri-rdp-broker
failregex = ^%(__prefix_line)sauth-fail user=\S+ rhost=<HOST> result=\S+ session=-$
ignoreregex =
journalmatch = _SYSTEMD_UNIT=niri-rdp-broker.service _UID=0 SYSLOG_IDENTIFIER=niri-rdp-broker
